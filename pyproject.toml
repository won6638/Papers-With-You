[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "citeweave-local-prototype"
version = "0.1.0a1"
description = "Private local-first arXiv collection prototype (working name)"
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = ["pypdf==6.10.0"]

[tool.setuptools.packages.find]
include = ["citeweave*"]
