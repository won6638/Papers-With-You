[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papers-with-you"
version = "0.1.0a1"
description = "Local tool for searching and downloading research papers"
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = ["pypdf==6.10.0"]

[tool.setuptools.packages.find]
include = ["PapersWithYou*"]
